name: CI

# Runs on every push and PR. Deliberately hits oq.dicknog.dk and grammarian's
# live published catalog in the e2e job (see playwright.config.js's own
# comment for why) rather than a frozen local fixture — this repo's stated
# posture is that a red build here can mean either a regression in this
# repo's own commit OR an upstream oq/grammarian break, and only the first
# kind is this workflow's fault to fix. A red e2e run is real information
# either way, not noise to route around.
on:
  push:
    branches: [master]
  pull_request:

jobs:
  lint-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:unit

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
